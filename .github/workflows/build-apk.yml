name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application and Android Resources
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          rm -f android/app/src/main/assets/server.cjs android/app/src/main/assets/server.cjs.map
          node scripts/generate-raw-chapters.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: |
          cd android
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build APK with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Assemble Debug and Release APKs
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thirukkural-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
